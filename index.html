<body data-view="games">
<div class="app">

  <aside class="side">
    <div class="bar">
      <a class="brand" href="./" aria-label="CJW GAMES"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="9" fill="#ffd23f" stroke="#1c1d2b" stroke-width="2.5"/><path d="M13 9.5v13l10-6.5z" fill="#ff5c8a" stroke="#1c1d2b" stroke-width="2" stroke-linejoin="round"/></svg><span>CJW GAMES</span></a>
      <div class="bar-tools">
        <label class="lang"><span class="sr" data-t="lang"></span>
          <select id="lang">
            <option value="ko">한국어</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="zh-Hans">简体中文</option>
            <option value="zh-Hant">繁體中文</option>
          </select>
        </label>
        <button id="me" class="me" type="button"></button>
      </div>
    </div>

    <div class="hero">
      <div class="field-wrap"><canvas id="field" class="field" width="360" height="360" aria-hidden="true"></canvas><span class="field-hint" data-t="tapHint"></span></div>
      <div class="hero-txt">
        <h1 id="hero-h" data-t="hero"></h1>
        <p data-t="heroSub"></p>
      </div>
    </div>

    <nav class="nav" aria-label="menu">
      <a href="#games" data-tab="games"><span data-t="tabGames"></span><small id="nav-games-n"></small></a>
      <a href="#rank" data-tab="rank"><span data-t="tabRank"></span></a>
      <a href="#reviews" data-tab="reviews"><span data-t="tabReviews"></span><small id="nav-rv-n"></small></a>
      <a href="#request" data-tab="request"><span data-t="tabRequest"></span></a>
    </nav>

    <p class="side-foot" data-t="footer"></p>
  </aside>

  <main class="main">
    <div id="back" class="back" hidden><a id="back-a" href="#"></a></div>
    <div id="notice" class="notice" hidden></div>

    <section id="v-games" class="view">
      <a id="cont" class="cont" href="#" hidden><span class="cont-k" data-t="cont"></span><span id="cont-n" class="cont-n"></span></a>
      <div id="genres" class="genres" hidden></div>
      <ul id="game-list" class="maps"></ul>
      <div id="latest" class="latest" hidden>
        <h2 data-t="latest"></h2>
        <div id="latest-body"></div>
        <a href="#reviews" class="text-link" data-t="seeAll"></a>
      </div>
    </section>

    <section id="v-rank" class="view" hidden>
      <h2 class="vh" data-t="tabRank"></h2>
      <div id="rank-games" class="pick" role="tablist"></div>
      <div class="seg" role="tablist">
        <button type="button" data-period="week" data-t="weekly"></button>
        <button type="button" data-period="all" data-t="allTime"></button>
      </div>
      <div class="boards">
        <div class="board" data-board="week"><h3 data-t="weekly"></h3><ol class="rank" id="rank-week"></ol></div>
        <div class="board" data-board="all"><h3 data-t="allTime"></h3><ol class="rank" id="rank-all"></ol></div>
      </div>
      <p class="hint" data-t="rankHint"></p>
    </section>

    <section id="v-reviews" class="view" hidden>
      <h2 class="vh" data-t="tabReviews"></h2>
      <div class="rv-layout">
        <div class="rv-main">
          <div class="rv-tools">
            <select id="rv-filter" aria-label="filter"></select>
            <button id="rv-open" class="btn ghost" type="button" data-t="writeOpen"></button>
          </div>
          <ul id="rv-list" class="reviews"></ul>
          <button id="rv-more" class="btn ghost wide" type="button" hidden data-t="more"></button>
        </div>
        <div id="rv-write" class="write"></div>
      </div>
    </section>

    <section id="v-request" class="view" hidden>
      <h2 class="vh" data-t="tabRequest"></h2>
      <div class="rq-layout">
        <form id="rq-form" class="form" autocomplete="off">
          <p class="lead" data-t="reqLead"></p>
          <fieldset class="kinds">
            <legend data-t="reqKind"></legend>
            <label><input type="radio" name="kind" value="게임 요청" checked><span data-t="kindGame"></span></label>
            <label><input type="radio" name="kind" value="버그"><span data-t="kindBug"></span></label>
            <label><input type="radio" name="kind" value="기타"><span data-t="kindEtc"></span></label>
          </fieldset>
          <label class="f"><span data-t="reqGame"></span><input name="game" maxlength="40"></label>
          <label class="f"><span data-t="reqMsg"></span><textarea name="msg" rows="6" maxlength="500" required></textarea></label>
          <input name="hp" class="hp" tabindex="-1" aria-hidden="true">
          <button class="btn" type="submit" data-t="send"></button>
        </form>
        <p class="rq-side" data-t="reqSide"></p>
      </div>
    </section>

    <p class="main-foot" data-t="footer"></p>
  </main>
</div>

<nav class="dock" aria-label="menu">
  <a href="#games" data-tab="games"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg><span data-t="tabGames"></span></a>
  <a href="#rank" data-tab="rank"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-5"/></svg><span data-t="tabRank"></span></a>
  <a href="#reviews" data-tab="reviews"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span data-t="tabReviews"></span></a>
  <a href="#request" data-tab="request"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-t="tabRequest"></span></a>
</nav>

<dialog id="dlg-login">
  <form id="login-form" method="dialog" autocomplete="off">
    <h2 data-t="login"></h2>
    <label class="f"><span data-t="nick"></span><input name="nick" minlength="2" maxlength="12" required autocomplete="username"></label>
    <label class="f"><span data-t="pin"></span><input name="pin" inputmode="numeric" pattern="\d{6}" maxlength="6" required autocomplete="current-password" type="password"></label>
    <p class="hint" data-t="loginNote"></p>
    <p id="login-err" class="err" hidden></p>
    <div class="dlg-act">
      <button class="btn ghost" type="button" value="cancel" data-t="cancel"></button>
      <button class="btn" type="submit" value="ok" data-t="login"></button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>

<script src="sdk.js?v=12"></script>
<script src="i18n.js?v=12"></script>
<script src="hub.js?v=12"></script>
